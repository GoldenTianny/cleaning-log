<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>클리닝 결과물 업로드</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <header class="top">
    <h1>클리닝 결과물 업로드</h1>
    <div class="nav">
      <span id="todayText" style="color:var(--muted);font-size:14px"></span>
    </div>
  </header>

  <div class="card">
    <div class="summary-bar">
      <span class="done" id="doneCount">0개 항목 완료</span>
      <span class="left" id="leftCount"></span>
    </div>
    <div class="sub">각 항목마다 <strong>사진</strong>을 찍거나 골라서 올려주세요. 자동 압축됩니다.</div>
  </div>

  <div id="checklist"></div>

  <div class="card" style="text-align:center;color:var(--muted);font-size:13px">
    문제가 있으면 의뢰인께 연락 부탁드립니다.
  </div>
</div>

<div class="modal" id="modal">
  <button class="close" id="modalClose">×</button>
  <img id="modalImg" alt="">
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const $ = (s, r=document) => r.querySelector(s);
const checklistEl = $('#checklist');
const toast = $('#toast');

function showToast(msg, isError) {
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { toast.className = 'toast'; }, 2200);
}

function openModal(src) {
  $('#modalImg').src = src;
  $('#modal').classList.add('show');
}
$('#modalClose').onclick = () => $('#modal').classList.remove('show');
$('#modal').onclick = (e) => { if (e.target.id === 'modal') $('#modal').classList.remove('show'); };

$('#todayText').textContent = App.formatDate(App.todayISO());

async function load() {
  const today = App.todayISO();
  const [defaults, extras, uploads] = await Promise.all([
    App.getDefaultChecklist(),
    App.getExtraRequest(today),
    App.getUploadsByDate(today)
  ]);

  const items = [
    ...defaults.map(name => ({ name, isExtra: false })),
    ...extras.map(name => ({ name, isExtra: true }))
  ];

  const byLabel = {};
  for (const u of uploads) {
    (byLabel[u.item_label] ||= []).push(u);
  }

  const doneCount = items.filter(it => byLabel[it.name] && byLabel[it.name].length > 0).length;
  $('#doneCount').textContent = `${doneCount}개 항목 완료`;
  $('#leftCount').textContent = `전체 ${items.length}개`;

  checklistEl.innerHTML = '';
  if (items.length === 0) {
    checklistEl.innerHTML = '<div class="card empty">아직 체크리스트가 설정되지 않았습니다.<br>의뢰인께 문의해주세요.</div>';
    return;
  }

  for (const item of items) {
    const photos = byLabel[item.name] || [];
    const div = document.createElement('div');
    div.className = 'checklist-item' + (photos.length > 0 ? ' done' : '') + (item.isExtra ? ' extra' : '');
    div.innerHTML = `
      <div class="head">
        <span class="name">${escapeHtml(item.name)}</span>
        ${item.isExtra ? '<span class="badge">오늘 추가</span>' : ''}
        <span class="count">${photos.length > 0 ? photos.length + '장' : ''}</span>
      </div>
      <label class="upload-btn">
        <input type="file" accept="image/*" capture="environment" multiple>
        ${photos.length > 0 ? '+ 사진 더 올리기' : '📷 사진 찍기 / 선택'}
      </label>
      <div class="thumbs"></div>
    `;
    const thumbs = div.querySelector('.thumbs');
    for (const p of photos) {
      const img = document.createElement('img');
      img.src = App.publicUrl(p.photo_path);
      img.onclick = () => openModal(img.src);
      thumbs.appendChild(img);
    }
    const input = div.querySelector('input[type=file]');
    input.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (files.length === 0) return;
      const btn = div.querySelector('.upload-btn');
      btn.style.pointerEvents = 'none';
      btn.textContent = `업로드 중... (0/${files.length})`;
      let done = 0;
      let failed = 0;
      for (const f of files) {
        try {
          await App.uploadPhoto({ file: f, itemLabel: item.name, isExtra: item.isExtra });
          done++;
        } catch (err) {
          console.error(err);
          failed++;
        }
        btn.textContent = `업로드 중... (${done}/${files.length})`;
      }
      if (failed > 0) showToast(`${failed}장 실패. 다시 시도해주세요.`, true);
      else showToast(`${done}장 업로드 완료!`);
      load();
    });
    checklistEl.appendChild(div);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

load().catch(err => {
  console.error(err);
  showToast('불러오기 실패: ' + err.message, true);
});
</script>
</body>
</html>
